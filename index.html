<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>預約照拿藥</title>

  <!-- LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    :root {

      --bg: #faf7f1;

      --card: #ffffff;

      --primary: #69401f;

      --primary-light: #f5eadc;

      --border: #e6ceb3;

      --text: #3f2c20;

      --muted: #8c7867;

      --danger: #b94c42;

    }


    html,
    body {

      margin: 0;

      min-height: 100%;

      background:
        var(--bg);

      color:
        var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    }


    body {

      padding:
        28px 16px 60px;

    }


    .page {

      width:
        min(
          100%,
          1050px
        );

      margin:
        0 auto;

    }



    /* ==================================================
       Header
    ================================================== */

    .header {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      align-items:
        center;

      gap:
        36px;

      margin-bottom:
        30px;

    }


    .header-left {

      padding:
        18px 8px;

    }


    .brand {

      display:
        flex;

      align-items:
        center;

      gap:
        12px;

      font-size:
        24px;

      font-weight:
        700;

      margin-bottom:
        38px;

    }


    .brand-icon {

      width:
        42px;

      height:
        42px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      border-radius:
        13px;

      background:
        #f4e4cd;

      font-size:
        21px;

    }


    .hero-title {

      margin:
        0 0 20px;

      font-size:
        clamp(
          34px,
          6vw,
          54px
        );

      letter-spacing:
        2px;

      line-height:
        1.25;

    }


    .hero-subtitle {

      font-size:
        18px;

      color:
        var(--muted);

      line-height:
        1.8;

    }



    /* ==================================================
       卡通人物
    ================================================== */

    .hero-image-wrap {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      min-height:
        420px;

      animation:
        heroFloat
        3.2s
        ease-in-out
        infinite;

    }


    .hero-image {

      width:
        100%;

      max-width:
        480px;

      max-height:
        430px;

      object-fit:
        contain;

      border-radius:
        28px;

      box-shadow:
        0 22px 45px
        rgba(
          76,
          46,
          20,
          0.10
        );

      animation:
        heroBreathe
        4.5s
        ease-in-out
        infinite;

      transform-origin:
        center bottom;

    }


    @keyframes heroFloat {

      0%,
      100% {

        transform:
          translateY(0);

      }


      50% {

        transform:
          translateY(-12px);

      }

    }


    @keyframes heroBreathe {

      0%,
      100% {

        transform:
          scale(1)
          rotate(0deg);

      }


      50% {

        transform:
          scale(1.015)
          rotate(0.4deg);

      }

    }



    /* ==================================================
       公告
    ================================================== */

    .notices {

      margin-bottom:
        30px;

    }


    .notice {

      padding:
        20px 24px;

      border-radius:
        18px;

      margin-bottom:
        16px;

      line-height:
        1.8;

      white-space:
        pre-line;

      border:
        1px solid
        var(--border);

      opacity:
        0;

      transform:
        translateY(12px);

      animation:
        noticeFadeIn
        0.5s
        ease
        forwards;

    }


    .notice:nth-child(1) {
      animation-delay: 0.05s;
    }

    .notice:nth-child(2) {
      animation-delay: 0.12s;
    }

    .notice:nth-child(3) {
      animation-delay: 0.19s;
    }

    .notice:nth-child(4) {
      animation-delay: 0.26s;
    }

    .notice:nth-child(5) {
      animation-delay: 0.33s;
    }


    @keyframes noticeFadeIn {

      to {

        opacity:
          1;

        transform:
          translateY(0);

      }

    }


    .notice-title {

      font-size:
        19px;

      font-weight:
        700;

      margin-bottom:
        8px;

    }
/* ==================================================
   重要公告
================================================== */

.notice-important {
  position: relative;

  background:
    linear-gradient(
      135deg,
      #fff8f3 0%,
      #fff3ea 100%
    );

  border:
    3px solid #df654e;

  border-radius:
    22px;

  padding:
    24px 28px 24px 105px;

  box-shadow:
    0 10px 28px
    rgba(
      190,
      80,
      55,
      0.10
    );
}


/* 左側圓形公告圖示 */

.notice-important::before {
  content: "📢";

  position: absolute;

  left:
    25px;

  top:
    50%;

  transform:
    translateY(-50%);

  width:
    58px;

  height:
    58px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    50%;

  background:
    #df654e;

  color:
    #fff;

  font-size:
    28px;

  box-shadow:
    0 6px 14px
    rgba(
      190,
      80,
      55,
      0.20
    );
}


/* 重要公告標題 */

.notice-important
.notice-title {

  margin-bottom:
    8px;

  color:
    #d85942;

  font-size:
    26px;

  font-weight:
    800;

  letter-spacing:
    1px;

}


/* 重要公告內容 */

.notice-important
.notice-title
+ div {

  color:
    #3f2c20;

  font-size:
    19px;

  font-weight:
    700;

  line-height:
    1.7;

}

    .notice-main {
      background: #fff;
    }


    .notice-info {
      background: #f7f3ed;
    }


    .notice-warning {

      background:
        #fff7e8;

      border-color:
        #efd4a4;

    }


    .notice-danger {

      background:
        #fff0ee;

      border-color:
        #efb7b1;

    }


    .notice-card {

      background:
        #fff;

      box-shadow:
        0 8px 28px
        rgba(
          90,
          58,
          26,
          0.06
        );

    }



    /* ==================================================
       Form
    ================================================== */

    .form-card {

      background:
        var(--card);

      padding:
        34px;

      border-radius:
        28px;

      box-shadow:
        0 18px 45px
        rgba(
          72,
          46,
          22,
          0.08
        );

      animation:
        formFadeIn
        0.6s
        ease;

    }


    @keyframes formFadeIn {

      from {

        opacity:
          0;

        transform:
          translateY(16px);

      }


      to {

        opacity:
          1;

        transform:
          translateY(0);

      }

    }


    .question {

      margin-bottom:
        28px;

    }


    .question-label {

      display:
        block;

      font-weight:
        700;

      font-size:
        18px;

      margin-bottom:
        10px;

    }


    .required {

      color:
        var(--danger);

      margin-left:
        4px;

    }


    .question-description {

      margin-top:
        -3px;

      margin-bottom:
        10px;

      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.6;

    }


    input[type="text"],
    textarea,
    select {

      width:
        100%;

      border:
        1px solid
        var(--border);

      background:
        #fff;

      border-radius:
        16px;

      padding:
        16px 18px;

      font-size:
        17px;

      color:
        var(--text);

      outline:
        none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;

    }


    input[type="text"]:focus,
    textarea:focus,
    select:focus {

      border-color:
        #b98c60;

      box-shadow:
        0 0 0 3px
        rgba(
          185,
          140,
          96,
          0.12
        );

      transform:
        translateY(-1px);

    }


    textarea {

      min-height:
        120px;

      resize:
        vertical;

    }



    /* ==================================================
       日期欄位
    ================================================== */

    .date-input-wrap {

      position:
        relative;

    }


    .date-picker-input {

      padding-right:
        56px !important;

      cursor:
        pointer;

      background:
        #fff !important;

    }


    .date-input-icon {

      position:
        absolute;

      right:
        17px;

      top:
        50%;

      transform:
        translateY(-50%);

      font-size:
        21px;

      pointer-events:
        none;

    }



    /* ==================================================
       Radio / Checkbox
    ================================================== */

    .radio-list {

      display:
        grid;

      gap:
        10px;

    }


    .radio-item {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      border:
        1px solid
        var(--border);

      border-radius:
        14px;

      padding:
        14px 16px;

      cursor:
        pointer;

      transition:
        0.2s ease;

    }


    .radio-item:hover {

      background:
        #fcf7ef;

      transform:
        translateY(-1px);

    }


    .radio-item input {

      transform:
        scale(1.15);

    }



    /* ==================================================
       Submit
    ================================================== */

    .submit-button {

      width:
        100%;

      border:
        0;

      border-radius:
        16px;

      padding:
        17px 20px;

      font-size:
        18px;

      font-weight:
        700;

      cursor:
        pointer;

      background:
        var(--primary);

      color:
        #fff;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;

      box-shadow:
        0 10px 22px
        rgba(
          105,
          64,
          31,
          0.18
        );

    }


    .submit-button:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 14px 28px
        rgba(
          105,
          64,
          31,
          0.24
        );

    }


    .submit-button:disabled {

      opacity:
        0.55;

      cursor:
        not-allowed;

      transform:
        none;

    }



    /* ==================================================
       Loading｜照拿藥開場畫面
    ================================================== */

    .loading {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      z-index: 100000;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      padding: 24px 16px;
      gap: 18px;

      background: #faf9f5;
    }


    .loading-image-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }


    .loading-image {
      width: 330px;
      max-width: 76vw;
      height: auto;
      border-radius: 0;
      box-shadow: none;

      animation:
        loadingFloatIcon
        1.8s
        ease-in-out
        infinite;

      filter:
        drop-shadow(
          0 14px 20px
          rgba(0, 0, 0, 0.10)
        );
    }


    @keyframes loadingFloatIcon {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }

    }


    .loading-title {
      font-size: 28px;
      font-weight: 700;
      color: #35694b;
      letter-spacing: 2px;
      line-height: 1.35;
    }


    .loading-subtitle {
      font-size: 18px;
      color: #888;
      letter-spacing: 1px;
      line-height: 1.6;
    }


    .wave-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      height: 25px;
      margin-top: 0;
    }


    .wave-dots span {
      width: 9px;
      height: 9px;
      background: #4f8a63;
      border-radius: 50%;

      animation:
        waveDot
        1.2s
        ease-in-out
        infinite;
    }


    .wave-dots span:nth-child(1) {
      animation-delay: 0s;
    }


    .wave-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }


    .wave-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }


    @keyframes waveDot {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      30% {
        transform: translateY(-9px);
        opacity: 1;
      }

    }


    .loading-error-message {
      display: none;
      margin-top: 6px;
      max-width: 280px;
      font-size: 14px;
      color: #777;
      line-height: 1.6;
    }



    /* ==================================================
       Message
    ================================================== */

    .message-card {

      background:
        #fff;

      text-align:
        center;

      padding:
        50px 25px;

      border-radius:
        26px;

      box-shadow:
        0 18px 45px
        rgba(
          72,
          46,
          22,
          0.08
        );

    }


    .message-card h2 {

      font-size:
        28px;

    }


    .message-card p {

      color:
        var(--muted);

      line-height:
        1.8;

    }



    /* ==================================================
       日期選擇器 Modal
    ================================================== */

    .date-modal-overlay {

      position:
        fixed;

      inset:
        0;

      display:
        none;

      align-items:
        center;

      justify-content:
        center;

      padding:
        18px;

      background:
        rgba(
          40,
          30,
          20,
          0.45
        );

      backdrop-filter:
        blur(4px);

      z-index:
        99999;

    }


    .date-modal-overlay.show {

      display:
        flex;

    }


    .date-modal {

      width:
        min(
          94vw,
          480px
        );

      background:
        #fffdf9;

      border-radius:
        26px;

      padding:
        24px 20px 20px;

      box-shadow:
        0 24px 70px
        rgba(
          50,
          35,
          20,
          0.28
        );

      animation:
        dateModalIn
        0.25s ease;

    }


    @keyframes dateModalIn {

      from {

        opacity:
          0;

        transform:
          translateY(18px)
          scale(0.97);

      }


      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    .date-modal-title {

      text-align:
        center;

      font-size:
        23px;

      font-weight:
        700;

      color:
        #3f2c20;

      margin-bottom:
        8px;

    }


    .date-modal-description {

      text-align:
        center;

      color:
        #8c7867;

      line-height:
        1.7;

      font-size:
        14px;

      margin-bottom:
        20px;

    }



    /* ==================================================
       日期滾輪
    ================================================== */

    .date-wheel-container {

      position:
        relative;

      display:
        grid;

      grid-template-columns:
        1.35fr 1fr 1fr;

      gap:
        4px;

      height:
        220px;

      overflow:
        hidden;

      border-radius:
        18px;

      background:
        #faf8f4;

    }


    .date-wheel-highlight {

      position:
        absolute;

      left:
        8px;

      right:
        8px;

      top:
        88px;

      height:
        44px;

      border-radius:
        10px;

      background:
        rgba(
          105,
          64,
          31,
          0.08
        );

      border-top:
        1px solid
        rgba(
          105,
          64,
          31,
          0.13
        );

      border-bottom:
        1px solid
        rgba(
          105,
          64,
          31,
          0.13
        );

      pointer-events:
        none;

      z-index:
        2;

    }


    .date-wheel-container::before,
    .date-wheel-container::after {

      content:
        "";

      position:
        absolute;

      left:
        0;

      right:
        0;

      height:
        80px;

      z-index:
        3;

      pointer-events:
        none;

    }


    .date-wheel-container::before {

      top:
        0;

      background:
        linear-gradient(
          to bottom,
          #faf8f4 15%,
          rgba(
            250,
            248,
            244,
            0
          )
        );

    }


    .date-wheel-container::after {

      bottom:
        0;

      background:
        linear-gradient(
          to top,
          #faf8f4 15%,
          rgba(
            250,
            248,
            244,
            0
          )
        );

    }


    .date-wheel {

      height:
        220px;

      overflow-y:
        auto;

      scroll-snap-type:
        y mandatory;

      overscroll-behavior:
        contain;

      -webkit-overflow-scrolling:
        touch;

      scrollbar-width:
        none;

      padding:
        88px 0;

    }


    .date-wheel::-webkit-scrollbar {

      display:
        none;

    }


    .date-wheel-item {

      height:
        44px;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      scroll-snap-align:
        center;

      font-size:
        18px;

      color:
        #aea096;

      transition:
        0.15s ease;

      user-select:
        none;

      cursor:
        pointer;

      white-space:
        nowrap;

    }


    .date-wheel-item.selected {

      color:
        #322319;

      font-size:
        20px;

      font-weight:
        700;

    }


    .date-selected-preview {

      text-align:
        center;

      margin:
        16px 0 18px;

      font-size:
        16px;

      color:
        #69401f;

      font-weight:
        600;

    }


    .date-modal-buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1.4fr;

      gap:
        10px;

    }


    .date-button {

      border:
        0;

      border-radius:
        14px;

      padding:
        14px 12px;

      font-size:
        16px;

      font-weight:
        700;

      cursor:
        pointer;

    }


    .date-button-cancel {

      background:
        #f2eee9;

      color:
        #6f6258;

    }


    .date-button-confirm {

      background:
        #69401f;

      color:
        #fff;

    }



    /* ==================================================
       Mobile
    ================================================== */
.notice-important {

  padding:
    20px 18px 20px 78px;

  border-width:
    2px;

  border-radius:
    18px;

}


.notice-important::before {

  left:
    17px;

  width:
    46px;

  height:
    46px;

  font-size:
    22px;

}


.notice-important
.notice-title {

  font-size:
    21px;

}


.notice-important
.notice-title
+ div {

  font-size:
    16px;

  line-height:
    1.65;

}
    @media (
      max-width: 720px
    ) {

      body {

        padding:
          16px 12px 40px;

      }


      .header {

        grid-template-columns:
          1fr;

        gap:
          10px;

      }


      .header-left {

        padding:
          8px 2px;

      }


      .brand {

        margin-bottom:
          20px;

      }


      .hero-image-wrap {

        min-height:
          auto;

      }


      .hero-image {

        max-width:
          360px;

        max-height:
          340px;

      }


      .form-card {

        padding:
          22px 18px;

        border-radius:
          22px;

      }


      .notice {

        padding:
          17px 18px;

      }

    }


    @media (
      max-width: 520px
    ) {

      .date-modal {

        width:
          96vw;

        padding:
          22px 14px 16px;

      }


      .date-wheel-container {

        height:
          210px;

      }


      .date-wheel {

        height:
          210px;

        padding:
          83px 0;

      }


      .date-wheel-highlight {

        top:
          83px;

      }


      .date-wheel-item {

        font-size:
          17px;

      }


      .date-wheel-item.selected {

        font-size:
          19px;

      }

    }


  </style>

</head>


<body>



  <!-- ==================================================
       Loading
  ================================================== -->

  <div
    id="loading"
    class="loading"
  >

    <div
      class="loading-image-wrap"
    >

      <img
        src="https://i.ibb.co/35ZfJJQ4/2026-09-18-225327.jpg"
        class="loading-image"
        alt="照拿藥表單"
      >

    </div>


    <div
      class="loading-title"
    >
      照拿藥表單
    </div>


    <div
      class="loading-subtitle"
    >
      正在確認您的 LINE 身分
    </div>


    <div
      class="wave-dots"
    >

      <span></span>
      <span></span>
      <span></span>

    </div>


    <div
      class="loading-error-message"
      id="errorMessage"
    >
      系統連線稍有延遲，正在為您開啟表單。
    </div>

  </div>



  <!-- ==================================================
       Main
  ================================================== -->

  <div
    id="app"
    class="page"
    style="display:none;"
  >


    <section
      class="header"
    >

      <div
        class="header-left"
      >

        <div
          class="brand"
        >

          <div
            class="brand-icon"
          >
            藥
          </div>


          <span
            id="clinicName"
          >
            瑞恩中醫
          </span>

        </div>


        <h1
          class="hero-title"
          id="pageTitle"
        >
          預約照拿藥
        </h1>


        <div
          class="hero-subtitle"
          id="pageSubtitle"
        >
        </div>

      </div>


      <div
        class="hero-image-wrap"
      >

        <img
          id="heroImage"
          class="hero-image"
          src="https://i.ibb.co/Kj8Y7nZ3/image.jpg"
          alt="照拿藥同意書"
        >

      </div>

    </section>



    <!-- 公告 -->

    <section
      id="notices"
      class="notices"
    >
    </section>



    <!-- 表單 -->

    <form
      id="dynamicForm"
      class="form-card"
    >

      <div
        id="questions"
      >
      </div>


      <button
        id="submitButton"
        type="submit"
        class="submit-button"
      >
        送出照拿藥申請
      </button>

  </div>



  <!-- ==================================================
       Message
  ================================================== -->

  <div
    id="messageArea"
    class="page"
    style="display:none;"
  >
  </div>



  <!-- ==================================================
       日期 Modal
  ================================================== -->

  <div
    id="dateModalOverlay"
    class="date-modal-overlay"
  >

    <div
      class="date-modal"
    >

      <div
        class="date-modal-title"
      >
        請選擇出生日期
      </div>


      <div
        class="date-modal-description"
      >
        請上下滑動選擇您的西元出生年月日
        <br>
        系統送出時會自動轉換為民國出生年月日
      </div>


      <div
        class="date-wheel-container"
      >

        <div
          class="date-wheel-highlight"
        >
        </div>


        <div
          id="yearWheel"
          class="date-wheel"
        >
        </div>


        <div
          id="monthWheel"
          class="date-wheel"
        >
        </div>


        <div
          id="dayWheel"
          class="date-wheel"
        >
        </div>

      </div>


      <div
        id="dateSelectedPreview"
        class="date-selected-preview"
      >
      </div>


      <div
        class="date-modal-buttons"
      >

        <button
          type="button"
          class="date-button date-button-cancel"
          id="dateCancelButton"
        >
          取消
        </button>


        <button
          type="button"
          class="date-button date-button-confirm"
          id="dateConfirmButton"
        >
          確認日期
        </button>

      </div>

    </div>

  </div>



  <script>


    /*************************************************
     * 系統設定
     *************************************************/

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbyJp3w3MNaJi1yNdWXHnegNqbkgxMmrGiMsx3KURcb4oZZr8YX461OXjk8zVnFMYVqh/exec';


    const LIFF_ID =
      '2007045157-vQ7lX7j2';


    const DEFAULT_HERO_IMAGE =
      'https://i.ibb.co/Kj8Y7nZ3/image.jpg';



    /*************************************************
     * 全域
     *************************************************/

    let formConfig =
      null;


    let lineProfile = {

      displayName:
        '',

      userId:
        ''

    };



    /*************************************************
     * 日期選擇器
     *************************************************/

    const WHEEL_ITEM_HEIGHT =
      44;


    let activeDateInput =
      null;


    let selectedYear =
      1990;


    let selectedMonth =
      1;


    let selectedDay =
      1;



    /*************************************************
     * Start
     *************************************************/

    document.addEventListener(
      'DOMContentLoaded',
      async () => {

        setupDateModalEvents();


        try {

          const continueLoad =
            await initLine();


          if (
            continueLoad === false
          ) {

            return;

          }


          await loadConfig();

        }

        catch (err) {

          console.error(
            err
          );


          showMessage(

            '系統載入失敗',

            '請稍後再試一次。'

          );

        }

      }
    );



    /*************************************************
     * LINE
     *************************************************/

    async function initLine() {

      try {

        await liff.init({

          liffId:
            LIFF_ID

        });


        if (
          !liff.isLoggedIn()
        ) {

          liff.login();

          return false;

        }


        const profile =
          await liff.getProfile();


        lineProfile = {

          displayName:
            profile.displayName ||
            '',

          userId:
            profile.userId ||
            ''

        };


        console.log(
          'LINE Profile:',
          lineProfile
        );


        return true;

      }

      catch (err) {

        console.warn(
          'LINE Profile 無法取得',
          err
        );


        lineProfile = {

          displayName:
            '',

          userId:
            ''

        };


        return true;

      }

    }



    /*************************************************
     * 讀取 Google Sheet
     *************************************************/

    async function loadConfig() {

      const url =

        `${GAS_URL}?action=config&_=${Date.now()}`;


      const response =
        await fetch(
          url
        );


      if (
        !response.ok
      ) {

        throw new Error(
          '無法載入設定'
        );

      }


      const result =
        await response.json();


      if (
        !result.success
      ) {

        throw new Error(

          result.message ||
          '讀取設定失敗'

        );

      }


      formConfig =
        result.data;


      renderForm();

    }



    /*************************************************
     * Render Form
     *************************************************/

    function renderForm() {

      const settings =
        formConfig.settings ||
        {};


      const enabled =

        settings.form_enabled === true

        ||

        String(
          settings.form_enabled
        )
          .trim()
          .toUpperCase()
        ===
        'TRUE';


      if (
        !enabled
      ) {

        showMessage(

          '目前暫停接受申請',

          settings.disabled_message ||
          '目前暫停接受照拿藥申請。'

        );


        return;

      }



      document.title =

        settings.page_title ||
        '預約照拿藥';



      document.getElementById(
        'clinicName'
      ).textContent =

        settings.clinic_name ||
        '瑞恩中醫';



      document.getElementById(
        'pageTitle'
      ).textContent =

        settings.page_title ||
        '預約照拿藥';



      document.getElementById(
        'pageSubtitle'
      ).textContent =

        settings.page_subtitle ||
        '請按問題依序填寫，送出後將盡快協助處理';



      const heroImage =
        document.getElementById(
          'heroImage'
        );


      heroImage.src =

        settings.hero_image_url ||
        DEFAULT_HERO_IMAGE;


      heroImage.onerror =
        () => {

          heroImage.src =
            DEFAULT_HERO_IMAGE;

        };



      renderNotices(

        formConfig.notices ||
        []

      );


      renderQuestions(

        formConfig.questions ||
        []

      );



      document.getElementById(
        'submitButton'
      ).textContent =

        settings.submit_text ||
        '送出照拿藥申請';



      document.getElementById(
        'loading'
      ).style.display =
        'none';



      document.getElementById(
        'app'
      ).style.display =
        'block';

    }



    /*************************************************
     * 公告
     *************************************************/

    function renderNotices(
      notices
    ) {

      const container =
        document.getElementById(
          'notices'
        );


      container.innerHTML =
        '';


      notices.forEach(
        notice => {

          const div =
            document.createElement(
              'div'
            );


          div.className =

            `notice notice-${notice.type || 'info'}`;


          if (
            notice.title
          ) {

            const title =
              document.createElement(
                'div'
              );


            title.className =
              'notice-title';


            title.textContent =
              notice.title;


            div.appendChild(
              title
            );

          }


          const content =
            document.createElement(
              'div'
            );


          content.textContent =
            notice.content ||
            '';


          if (
            notice.bold
          ) {

            content.style.fontWeight =
              '700';

          }


          div.appendChild(
            content
          );


          container.appendChild(
            div
          );

        }
      );

    }



    /*************************************************
     * 題目
     *************************************************/

    function renderQuestions(
      questions
    ) {

      const container =
        document.getElementById(
          'questions'
        );


      container.innerHTML =
        '';


      questions.forEach(
        question => {

          if (
            question.type ===
            'hidden'
          ) {

            return;

          }


          if (
            question.visible ===
            false
          ) {

            return;

          }


          const wrapper =
            document.createElement(
              'div'
            );


          wrapper.className =
            'question';



          const label =
            document.createElement(
              'label'
            );


          label.className =
            'question-label';


          label.textContent =
            question.label ||
            '';


          if (
            question.required
          ) {

            const star =
              document.createElement(
                'span'
              );


            star.className =
              'required';


            star.textContent =
              '*';


            label.appendChild(
              star
            );

          }


          wrapper.appendChild(
            label
          );



          if (
            question.description
          ) {

            const desc =
              document.createElement(
                'div'
              );


            desc.className =
              'question-description';


            desc.textContent =
              question.description;


            wrapper.appendChild(
              desc
            );

          }



          const input =
            createInput(
              question
            );


          wrapper.appendChild(
            input
          );


          container.appendChild(
            wrapper
          );

        }
      );

    }



    /*************************************************
     * Create Input
     *************************************************/

    function createInput(
      question
    ) {


      /* ===============================
         textarea
      =============================== */

      if (
        question.type ===
        'textarea'
      ) {

        const input =
          document.createElement(
            'textarea'
          );


        input.name =
          question.id;


        input.placeholder =
          question.placeholder ||
          '';


        input.required =
          !!question.required;


        return input;

      }



      /* ===============================
         date
      =============================== */

      if (
        question.type ===
        'date'
      ) {

        const wrap =
          document.createElement(
            'div'
          );


        wrap.className =
          'date-input-wrap';



        const input =
          document.createElement(
            'input'
          );


        input.type =
          'text';


        input.name =
          question.id;


        input.placeholder =

          question.placeholder ||
          '請點選出生日期';


        input.className =
          'date-picker-input';


        input.autocomplete =
          'off';


        input.readOnly =
          true;


        input.dataset.required =

          question.required
            ? 'true'
            : 'false';



        input.addEventListener(
          'click',
          () => {

            openDatePicker(
              input
            );

          }
        );



        const icon =
          document.createElement(
            'span'
          );


        icon.className =
          'date-input-icon';


        icon.textContent =
          '📅';



        wrap.appendChild(
          input
        );


        wrap.appendChild(
          icon
        );


        return wrap;

      }



      /***********************************************
       * select
       ***********************************************/

      if (
        question.type ===
        'select'
      ) {

        const wrap =
          document.createElement(
            'div'
          );


        const select =
          document.createElement(
            'select'
          );


        select.name =
          question.id;


        select.required =
          !!question.required;


        const empty =
          document.createElement(
            'option'
          );


        empty.value =
          '';


        empty.textContent =
          '請選擇';


        select.appendChild(
          empty
        );


        const hasOther =
          (
            question.options ||
            []
          ).some(
            option =>
              option.value ===
              '__OTHER__'
          );


        (
          question.options ||
          []
        ).forEach(
          option => {

            const item =
              document.createElement(
                'option'
              );


            item.value =
              option.value;


            item.textContent =
              option.label;


            select.appendChild(
              item
            );

          }
        );


        wrap.appendChild(
          select
        );


        /***********************************************
         * 有「其他」選項時才建立自由輸入欄位
         ***********************************************/

        if (
          hasOther
        ) {

          const otherInput =
            document.createElement(
              'input'
            );


          otherInput.type =
            'text';


          otherInput.className =
            'other-input';


          otherInput.dataset.forQuestion =
            question.id;


          otherInput.dataset.optionType =
            'select';


          otherInput.style.display =
            'none';


          otherInput.style.marginTop =
            '10px';


          const otherNotice =
            document.createElement(
              'div'
            );


          otherNotice.style.display =
            'none';


          otherNotice.style.marginTop =
            '8px';


          otherNotice.style.fontSize =
            '14px';


          otherNotice.style.lineHeight =
            '1.6';


          otherNotice.style.color =
            '#b06a3c';


          /*********************************************
           * 不同題目顯示不同提示
           *********************************************/

          if (
            question.id ===
            'days'
          ) {

            otherInput.placeholder =
              '請自行輸入拿藥天數，例如：12';


            otherInput.inputMode =
              'numeric';


            otherNotice.textContent =
              '⚠ 健保最多提供 14 天，超過 14 天的部分需自費開立。';

          }

          else if (
            question.id ===
            'pickup'
          ) {

            otherInput.placeholder =
              '例如：9/25上午、9/26下午';


            otherNotice.textContent =
              '請填寫實際希望取藥的日期與時段。';

          }

          else {

            otherInput.placeholder =
              '請輸入其他內容';


            otherNotice.textContent =
              '請填寫其他內容。';

          }


          wrap.appendChild(
            otherInput
          );


          wrap.appendChild(
            otherNotice
          );


          select.addEventListener(
            'change',
            () => {

              if (
                select.value ===
                '__OTHER__'
              ) {

                otherInput.style.display =
                  'block';


                otherNotice.style.display =
                  'block';


                otherInput.required =
                  !!question.required;


                setTimeout(
                  () => {

                    otherInput.focus();

                  },
                  50
                );

              }

              else {

                otherInput.style.display =
                  'none';


                otherNotice.style.display =
                  'none';


                otherInput.required =
                  false;


                otherInput.value =
                  '';

              }

            }
          );

        }


        return wrap;

      }


      /* ===============================
         radio
      =============================== */

      if (
        question.type ===
        'radio'
      ) {

        const container =
          document.createElement(
            'div'
          );


        container.className =
          'radio-list';



        (
          question.options ||
          []
        )
          .forEach(
            option => {

              const label =
                document.createElement(
                  'label'
                );


              label.className =
                'radio-item';



              const radio =
                document.createElement(
                  'input'
                );


              radio.type =
                'radio';


              radio.name =
                question.id;


              radio.value =
                option.value;


              radio.required =
                !!question.required;



              const span =
                document.createElement(
                  'span'
                );


              span.textContent =
                option.label;



              label.appendChild(
                radio
              );


              label.appendChild(
                span
              );


              container.appendChild(
                label
              );

            }
          );


        return container;

      }



      /***********************************************
       * checkbox
       ***********************************************/

      if (
        question.type ===
        'checkbox'
      ) {

        const container =
          document.createElement(
            'div'
          );


        container.className =
          'radio-list';


        const noAdjustValues =
          [
            '不需要，照上次即可。',
            '不需要調整'
          ];


        (
          question.options ||
          []
        ).forEach(
          option => {

            const itemWrap =
              document.createElement(
                'div'
              );


            const label =
              document.createElement(
                'label'
              );


            label.className =
              'radio-item';


            const checkbox =
              document.createElement(
                'input'
              );


            checkbox.type =
              'checkbox';


            checkbox.name =
              question.id;


            checkbox.value =
              option.value;


            const span =
              document.createElement(
                'span'
              );


            span.textContent =
              option.label;


            label.appendChild(
              checkbox
            );


            label.appendChild(
              span
            );


            itemWrap.appendChild(
              label
            );


            /***********************************************
             * 「其他」輸入欄位
             ***********************************************/

            if (
              option.value ===
              '__OTHER__'
            ) {

              const otherInput =
                document.createElement(
                  'input'
                );


              otherInput.type =
                'text';


              otherInput.placeholder =
                '請輸入其他服藥狀況';


              otherInput.className =
                'other-input';


              otherInput.dataset.forQuestion =
                question.id;


              otherInput.dataset.optionType =
                'checkbox';


              otherInput.style.display =
                'none';


              otherInput.style.marginTop =
                '10px';


              itemWrap.appendChild(
                otherInput
              );


              checkbox.addEventListener(
                'change',
                () => {

                  if (
                    checkbox.checked
                  ) {

                    otherInput.style.display =
                      'block';


                    setTimeout(
                      () => {

                        otherInput.focus();

                      },
                      50
                    );

                  }

                  else {

                    otherInput.style.display =
                      'none';


                    otherInput.value =
                      '';

                  }

                }
              );

            }


            /***********************************************
             * 「不需要，照上次即可」與其他症狀互斥
             ***********************************************/

            checkbox.addEventListener(
              'change',
              () => {

                if (
                  !checkbox.checked
                ) {

                  return;

                }


                const allCheckboxes =
                  Array.from(
                    container.querySelectorAll(
                      `input[type="checkbox"][name="${question.id}"]`
                    )
                  );


                if (
                  noAdjustValues.includes(
                    checkbox.value
                  )
                ) {

                  allCheckboxes.forEach(
                    otherCheckbox => {

                      if (
                        otherCheckbox !==
                        checkbox
                      ) {

                        otherCheckbox.checked =
                          false;

                      }

                    }
                  );


                  const otherInput =
                    container.querySelector(
                      `.other-input[data-for-question="${question.id}"][data-option-type="checkbox"]`
                    );


                  if (
                    otherInput
                  ) {

                    otherInput.style.display =
                      'none';


                    otherInput.value =
                      '';

                  }

                }

                else {

                  allCheckboxes.forEach(
                    otherCheckbox => {

                      if (
                        noAdjustValues.includes(
                          otherCheckbox.value
                        )
                      ) {

                        otherCheckbox.checked =
                          false;

                      }

                    }
                  );

                }

              }
            );


            container.appendChild(
              itemWrap
            );

          }
        );


        return container;

      }


      /* ===============================
         text
      =============================== */

      const input =
        document.createElement(
          'input'
        );


      input.type =
        'text';


      input.name =
        question.id;


      input.placeholder =
        question.placeholder ||
        '';


      input.required =
        !!question.required;


      return input;

    }



    /*************************************************
     * 日期 Modal Event
     *************************************************/

    function setupDateModalEvents() {

      document
        .getElementById(
          'dateCancelButton'
        )
        .addEventListener(
          'click',
          closeDatePicker
        );


      document
        .getElementById(
          'dateConfirmButton'
        )
        .addEventListener(
          'click',
          confirmDatePicker
        );


      document
        .getElementById(
          'dateModalOverlay'
        )
        .addEventListener(
          'click',
          event => {

            if (
              event.target.id ===
              'dateModalOverlay'
            ) {

              closeDatePicker();

            }

          }
        );

    }



    /*************************************************
     * 打開日期
     *************************************************/

    function openDatePicker(
      input
    ) {

      activeDateInput =
        input;



      selectedYear =
        1990;


      selectedMonth =
        1;


      selectedDay =
        1;



      if (
        input.value
      ) {

        const parts =
          input.value.split(
            '/'
          );


        if (
          parts.length === 3
        ) {

          selectedYear =
            Number(
              parts[0]
            );


          selectedMonth =
            Number(
              parts[1]
            );


          selectedDay =
            Number(
              parts[2]
            );

        }

      }



      buildAllDateWheels();



      document
        .getElementById(
          'dateModalOverlay'
        )
        .classList
        .add(
          'show'
        );



      document.body.style.overflow =
        'hidden';



      setTimeout(
        () => {

          scrollAllDateWheels();

        },
        50
      );


      updateDateSelection();

    }



    /*************************************************
     * 建立全部 Wheel
     *************************************************/

    function buildAllDateWheels() {

      buildYearWheel();

      buildMonthWheel();

      buildDayWheel();

    }



    /*************************************************
     * 年
     *************************************************/

    function buildYearWheel() {

      const currentYear =
        new Date()
          .getFullYear();


      const values = [];


      for (
        let year = 1920;
        year <= currentYear;
        year++
      ) {

        values.push(
          year
        );

      }



      buildWheel(

        'yearWheel',

        values,

        value =>
          `${value}年`,

        selectedYear,

        value => {

          selectedYear =
            value;


          rebuildDayWheel();

        }

      );

    }



    /*************************************************
     * 月
     *************************************************/

    function buildMonthWheel() {

      const values = [];


      for (
        let month = 1;
        month <= 12;
        month++
      ) {

        values.push(
          month
        );

      }



      buildWheel(

        'monthWheel',

        values,

        value =>
          `${value}月`,

        selectedMonth,

        value => {

          selectedMonth =
            value;


          rebuildDayWheel();

        }

      );

    }



    /*************************************************
     * 日
     *************************************************/

    function buildDayWheel() {

      const maxDay =
        getDaysInMonth(

          selectedYear,

          selectedMonth

        );


      if (
        selectedDay > maxDay
      ) {

        selectedDay =
          maxDay;

      }



      const values = [];


      for (
        let day = 1;
        day <= maxDay;
        day++
      ) {

        values.push(
          day
        );

      }



      buildWheel(

        'dayWheel',

        values,

        value =>
          `${value}日`,

        selectedDay,

        value => {

          selectedDay =
            value;


          updateDateSelection();

        }

      );

    }



    /*************************************************
     * 共用 Wheel
     *************************************************/

    function buildWheel(

      wheelId,

      values,

      formatter,

      selectedValue,

      onChange

    ) {

      const wheel =
        document.getElementById(
          wheelId
        );



      if (
        wheel._wheelHandler
      ) {

        wheel.removeEventListener(

          'scroll',

          wheel._wheelHandler

        );

      }



      wheel.innerHTML =
        '';



      values.forEach(
        value => {

          const item =
            document.createElement(
              'div'
            );


          item.className =
            'date-wheel-item';


          item.dataset.value =
            value;


          item.textContent =
            formatter(
              value
            );



          item.addEventListener(
            'click',
            () => {

              onChange(
                Number(value)
              );


              scrollWheelToValue(

                wheel,

                value,

                true

              );



              updateDateSelection();

            }
          );


          wheel.appendChild(
            item
          );

        }
      );



      let timer =
        null;



      wheel._wheelHandler =
        () => {

          clearTimeout(
            timer
          );


          timer =
            setTimeout(
              () => {

                const items =
                  wheel.querySelectorAll(
                    '.date-wheel-item'
                  );


                const index =
                  Math.max(

                    0,

                    Math.min(

                      items.length - 1,

                      Math.round(

                        wheel.scrollTop /
                        WHEEL_ITEM_HEIGHT

                      )

                    )

                  );


                if (
                  !items[index]
                ) {

                  return;

                }


                const value =
                  Number(
                    items[index]
                      .dataset
                      .value
                  );


                onChange(
                  value
                );


                updateDateSelection();

              },
              70
            );

        };



      wheel.addEventListener(

        'scroll',

        wheel._wheelHandler

      );



      highlightWheelValue(

        wheelId,

        selectedValue

      );

    }



    /*************************************************
     * 重建日
     *************************************************/

    function rebuildDayWheel() {

      const maxDay =
        getDaysInMonth(

          selectedYear,

          selectedMonth

        );


      selectedDay =
        Math.min(

          selectedDay,

          maxDay

        );


      buildDayWheel();


      setTimeout(
        () => {

          scrollWheelToValue(

            document.getElementById(
              'dayWheel'
            ),

            selectedDay,

            false

          );


          updateDateSelection();

        },
        0
      );

    }



    /*************************************************
     * 月份天數
     *************************************************/

    function getDaysInMonth(

      year,

      month

    ) {

      return new Date(

        year,

        month,

        0

      ).getDate();

    }



    /*************************************************
     * Wheel Scroll
     *************************************************/

    function scrollWheelToValue(

      wheel,

      value,

      smooth = false

    ) {

      const items =
        Array.from(

          wheel.querySelectorAll(
            '.date-wheel-item'
          )

        );


      const index =
        items.findIndex(
          item =>

            Number(
              item.dataset.value
            )
            ===
            Number(value)

        );


      if (
        index < 0
      ) {

        return;

      }



      wheel.scrollTo({

        top:

          index *
          WHEEL_ITEM_HEIGHT,

        behavior:

          smooth
            ? 'smooth'
            : 'auto'

      });

    }



    /*************************************************
     * 初始 Scroll
     *************************************************/

    function scrollAllDateWheels() {

      scrollWheelToValue(

        document.getElementById(
          'yearWheel'
        ),

        selectedYear

      );


      scrollWheelToValue(

        document.getElementById(
          'monthWheel'
        ),

        selectedMonth

      );


      scrollWheelToValue(

        document.getElementById(
          'dayWheel'
        ),

        selectedDay

      );

    }



    /*************************************************
     * 高亮
     *************************************************/

    function highlightWheelValue(

      wheelId,

      value

    ) {

      const wheel =
        document.getElementById(
          wheelId
        );


      wheel
        .querySelectorAll(
          '.date-wheel-item'
        )
        .forEach(
          item => {

            item.classList.toggle(

              'selected',

              Number(
                item.dataset.value
              )
              ===
              Number(value)

            );

          }
        );

    }



    /*************************************************
     * Date Selection
     *************************************************/

    function updateDateSelection() {

      highlightWheelValue(

        'yearWheel',

        selectedYear

      );


      highlightWheelValue(

        'monthWheel',

        selectedMonth

      );


      highlightWheelValue(

        'dayWheel',

        selectedDay

      );


      updateDatePreview();

    }



    /*************************************************
     * 預覽
     *************************************************/

    function updateDatePreview() {

      const month =
        String(
          selectedMonth
        ).padStart(
          2,
          '0'
        );


      const day =
        String(
          selectedDay
        ).padStart(
          2,
          '0'
        );


      const rocYear =
        selectedYear -
        1911;


      const roc =
        String(
          rocYear
        ).padStart(
          3,
          '0'
        );


      document.getElementById(
        'dateSelectedPreview'
      ).textContent =

        `${selectedYear}/${month}/${day} ｜ 民國 ${roc} 年`;

    }



    /*************************************************
     * 確認日期
     *************************************************/

    function confirmDatePicker() {

      if (
        !activeDateInput
      ) {

        return;

      }


      const month =
        String(
          selectedMonth
        ).padStart(
          2,
          '0'
        );


      const day =
        String(
          selectedDay
        ).padStart(
          2,
          '0'
        );


      activeDateInput.value =

        `${selectedYear}/${month}/${day}`;


      closeDatePicker();

    }



    /*************************************************
     * Close Date
     *************************************************/

    function closeDatePicker() {

      document
        .getElementById(
          'dateModalOverlay'
        )
        .classList
        .remove(
          'show'
        );


      document.body.style.overflow =
        '';


      activeDateInput =
        null;

    }



    /*************************************************
     * 西元 → 民國7碼
     *************************************************/

    function toRoc7(
      dateText
    ) {

      if (
        !dateText
      ) {

        return '';

      }


      const parts =
        String(
          dateText
        )
          .trim()
          .split(
            '/'
          );


      if (
        parts.length !== 3
      ) {

        return dateText;

      }


      const year =
        Number(
          parts[0]
        );


      const month =
        Number(
          parts[1]
        );


      const day =
        Number(
          parts[2]
        );


      if (
        !year ||
        !month ||
        !day
      ) {

        return dateText;

      }


      const rocYear =
        year -
        1911;


      if (
        rocYear <= 0
      ) {

        return dateText;

      }


      return (

        String(
          rocYear
        ).padStart(
          3,
          '0'
        )

        +

        String(
          month
        ).padStart(
          2,
          '0'
        )

        +

        String(
          day
        ).padStart(
          2,
          '0'
        )

      );

    }



    /*************************************************
     * 前端必填檢查
     *************************************************/

    function validateRequiredFields() {

      const questions =
        formConfig.questions ||
        [];


      for (
        const question of questions
      ) {

        if (
          !question.required
          ||
          question.type ===
          'hidden'
        ) {

          continue;

        }


        /***********************************************
         * radio
         ***********************************************/

        if (
          question.type ===
          'radio'
        ) {

          const checked =
            document.querySelector(
              `input[name="${question.id}"]:checked`
            );


          if (
            !checked
          ) {

            alert(
              `請填寫「${question.label}」`
            );


            return false;

          }

        }


        /***********************************************
         * checkbox
         ***********************************************/

        else if (
          question.type ===
          'checkbox'
        ) {

          const checked =
            Array.from(
              document.querySelectorAll(
                `input[name="${question.id}"]:checked`
              )
            );


          if (
            checked.length === 0
          ) {

            alert(
              `請填寫「${question.label}」`
            );


            return false;

          }


          const otherChecked =
            checked.find(
              item =>
                item.value ===
                '__OTHER__'
            );


          if (
            otherChecked
          ) {

            const otherInput =
              document.querySelector(
                `.other-input[data-for-question="${question.id}"][data-option-type="checkbox"]`
              );


            const otherValue =
              otherInput
                ? String(
                    otherInput.value ||
                    ''
                  ).trim()
                : '';


            if (
              !otherValue
            ) {

              alert(
                `請輸入「${question.label}」的其他內容`
              );


              if (
                otherInput
              ) {

                otherInput.focus();

              }


              return false;

            }

          }

        }


        /***********************************************
         * text / textarea / select / date
         ***********************************************/

        else {

          const input =
            document.querySelector(
              `[name="${question.id}"]`
            );


          const value =
            input
              ? String(
                  input.value ||
                  ''
                ).trim()
              : '';


          if (
            !value
          ) {

            alert(
              `請填寫「${question.label}」`
            );


            if (
              question.type ===
              'date'
              &&
              input
            ) {

              openDatePicker(
                input
              );

            }

            else if (
              input
            ) {

              input.focus();

            }


            return false;

          }


          /*********************************************
           * select 選「其他」時，必須填自由輸入欄位
           *********************************************/

          if (
            question.type ===
            'select'
            &&
            value ===
            '__OTHER__'
          ) {

            const otherInput =
              document.querySelector(
                `.other-input[data-for-question="${question.id}"][data-option-type="select"]`
              );


            const otherValue =
              otherInput
                ? String(
                    otherInput.value ||
                    ''
                  ).trim()
                : '';


            if (
              !otherValue
            ) {

              alert(
                `請輸入「${question.label}」的其他內容`
              );


              if (
                otherInput
              ) {

                otherInput.focus();

              }


              return false;

            }

          }

        }

      }


      return true;

    }



    /*************************************************
     * Submit
     *************************************************/

    document
      .getElementById(
        'dynamicForm'
      )
      .addEventListener(
        'submit',
        async event => {

          event.preventDefault();


          if (
            !validateRequiredFields()
          ) {

            return;

          }


          const button =
            document.getElementById(
              'submitButton'
            );


          try {

            button.disabled =
              true;


            button.textContent =
              '資料送出中...';



            const answers =
              {};



            (
              formConfig.questions ||
              []
            )
              .forEach(
                question => {

                  if (
                    question.type ===
                    'hidden'
                  ) {

                    return;

                  }



                  if (
                    question.type ===
                    'radio'
                  ) {

                    const checked =
                      document.querySelector(

                        `input[name="${question.id}"]:checked`

                      );


                    answers[
                      question.id
                    ] =

                      checked
                        ? checked.value
                        : '';

                  }


                  else if (
                    question.type ===
                    'checkbox'
                  ) {

                    const checked =
                      Array.from(
                        document.querySelectorAll(
                          `input[name="${question.id}"]:checked`
                        )
                      );


                    const values =
                      [];


                    checked.forEach(
                      item => {

                        if (
                          item.value ===
                          '__OTHER__'
                        ) {

                          const otherInput =
                            document.querySelector(
                              `.other-input[data-for-question="${question.id}"][data-option-type="checkbox"]`
                            );


                          const otherValue =
                            otherInput
                              ? String(
                                  otherInput.value ||
                                  ''
                                ).trim()
                              : '';


                          if (
                            !otherValue
                          ) {

                            throw new Error(
                              `請輸入「${question.label}」的其他內容`
                            );

                          }


                          values.push(
                            otherValue
                          );

                        }

                        else {

                          values.push(
                            item.value
                          );

                        }

                      }
                    );


                    answers[
                      question.id
                    ] =
                      values.join(
                        '、'
                      );

                  }


                  else {

const input =
  document.querySelector(
    `[name="${question.id}"]`
  );


let value =
  input
    ? String(
        input.value
      ).trim()
    : '';


                    /***********************************************
                     * 下拉選單選「其他」
                     ***********************************************/

                    if (
                      question.type ===
                      'select'
                      &&
                      value ===
                      '__OTHER__'
                    ) {

                      const otherInput =
                        document.querySelector(
                          `.other-input[data-for-question="${question.id}"][data-option-type="select"]`
                        );


                      const otherValue =
                        otherInput
                          ? String(
                              otherInput.value ||
                              ''
                            ).trim()
                          : '';


                      if (
                        !otherValue
                      ) {

                        throw new Error(
                          `請輸入「${question.label}」的其他內容`
                        );

                      }


                      if (
                        question.id ===
                        'days'
                      ) {

                        const normalizedDays =
                          otherValue.replace(
                            /天\s*$/,
                            ''
                          );


                        value =
                          normalizedDays +
                          '天';

                      }

                      else {

                        value =
                          otherValue;

                      }

                    }


                    /* birthday 才轉民國7碼 */

                    if (
                      question.type ===
                      'date'
                      &&
                      question.id ===
                      'birthday'
                      &&
                      value
                    ) {

                      value =
                        toRoc7(
                          value
                        );

                    }


                    answers[
                      question.id
                    ] =
                      value;

                  }

                }
              );



            await submitData(
              answers
            );



            showMessage(

              formConfig.settings
                .success_title
              ||
              '申請成功',

              formConfig.settings
                .success_message
              ||
              '已收到您的照拿藥申請。'

            );

          }

          catch (err) {

            console.error(
              err
            );


            alert(

              err.message
              ||
              '送出失敗，請稍後再試'

            );


            button.disabled =
              false;


            button.textContent =

              formConfig.settings
                .submit_text
              ||
              '送出照拿藥申請';

          }

        }
      );



    /*************************************************
     * POST GAS
     *************************************************/

    async function submitData(
      answers
    ) {

      const payload = {

        action:
          'submit',

        answers:
          answers,

        lineName:
          lineProfile.displayName,

        userId:
          lineProfile.userId

      };


      const response =
        await fetch(
          GAS_URL,
          {

            method:
              'POST',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


      const result =
        await response.json();


      if (
        !result.success
      ) {

        throw new Error(

          result.message ||
          '送出失敗'

        );

      }


      return result;

    }



    /*************************************************
     * Message
     *************************************************/

    function showMessage(
      title,
      message
    ) {

      document.getElementById(
        'loading'
      ).style.display =
        'none';


      document.getElementById(
        'app'
      ).style.display =
        'none';


      const area =
        document.getElementById(
          'messageArea'
        );


      area.style.display =
        'block';


      area.innerHTML =
        '';


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'message-card';



      const h2 =
        document.createElement(
          'h2'
        );


      h2.textContent =
        title;



      const p =
        document.createElement(
          'p'
        );


      p.textContent =
        message;



      card.appendChild(
        h2
      );


      card.appendChild(
        p
      );


      area.appendChild(
        card
      );

    }


  </script>
